{% extends "base.html" %}

{% block title %}500 - Internal Server Error - GreenCart{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-warning mb-3">500</div>
    <h3 class="fw-bold text-dark mb-3">Internal Server Error</h3>
    <p class="text-muted mb-4 fs-5">Something unexpected occurred. Our engineering team has been notified.</p>
    <a href="{{ url_for('customer.index') }}" class="btn btn-success btn-lg rounded-pill px-5 fw-bold shadow">
      <i class="bi bi-arrow-counterclockwise me-2"></i>Return Home
    </a>
  </div>
</div>
{% endblock %}
