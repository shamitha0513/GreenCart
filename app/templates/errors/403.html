{% extends "base.html" %}

{% block title %}403 - Access Denied - GreenCart{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-danger mb-3">403</div>
    <h3 class="fw-bold text-dark mb-3">Access Denied</h3>
    <p class="text-muted mb-4 fs-5">You do not have permission to view or access this portal area.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow">
      <i class="bi bi-person-badge me-2"></i>Go to Login Portal
    </a>
  </div>
</div>
{% endblock %}
