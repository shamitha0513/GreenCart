{% extends "base.html" %}

{% block title %}My Profile - GreenCart{% endblock %}

{% block content %}
<div class="container py-4">
  
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
        <div class="avatar-circle bg-success text-white mx-auto mb-3 rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 80px; height: 80px; font-size: 2rem;">
          {{ user.name[0] }}
        </div>
        <h4 class="fw-bold mb-1">{{ user.name }}</h4>
        <p class="text-muted small mb-2"><i class="bi bi-envelope me-1"></i>{{ user.email }}</p>
        <span class="badge bg-success-subtle text-success rounded-pill px-3 py-2 fw-bold w-fit mx-auto mb-3">{{ user.role }} ACCOUNT</span>
        
        <hr>

        <div class="d-grid gap-2">
          <a href="{{ url_for('customer.my_orders') }}" class="btn btn-outline-success rounded-pill fw-bold">
            <i class="bi bi-bag-check me-2"></i>View Order History
          </a>
          <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger rounded-pill fw-bold">
            <i class="bi bi-box-arrow-right me-2"></i>Logout
          </a>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      
      <!-- Edit Profile Details Card -->
      <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
        <h5 class="fw-bold text-dark mb-4"><i class="bi bi-pencil-square me-2 text-success"></i>Edit Personal Information</h5>

        <form method="POST" action="{{ url_for('customer.profile') }}">
          <input type="hidden" name="action" value="update_profile">
          
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone Number</label>
              <input type="tel" class="form-control" name="phone" value="{{ user.phone }}" required>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Street Address</label>
              <textarea class="form-control" name="address" rows="2" required>{% if address %}{{ address.address }}{% endif %}</textarea>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">City</label>
              <input type="text" class="form-control" name="city" value="{% if address %}{{ address.city }}{% endif %}" required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">State</label>
              <input type="text" class="form-control" name="state" value="{% if address %}{{ address.state }}{% endif %}" required>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Pincode</label>
              <input type="text" class="form-control" name="pincode" value="{% if address %}{{ address.pincode }}{% endif %}" required>
            </div>
          </div>

          <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm">Save Profile Changes</button>
        </form>
      </div>

      <!-- Change Password Card -->
      <div class="card border-0 shadow-sm rounded-4 p-4">
        <h5 class="fw-bold text-dark mb-4"><i class="bi bi-key me-2 text-success"></i>Change Password</h5>

        <form method="POST" action="{{ url_for('customer.profile') }}">
          <input type="hidden" name="action" value="change_password">
          
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Current Password</label>
              <input type="password" class="form-control" name="old_password" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">New Password</label>
              <input type="password" class="form-control" name="new_password" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Confirm New Password</label>
              <input type="password" class="form-control" name="confirm_password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-warning text-dark rounded-pill px-4 fw-bold shadow-sm">Update Password</button>
        </form>
      </div>

    </div>
  </div>

</div>
{% endblock %}
