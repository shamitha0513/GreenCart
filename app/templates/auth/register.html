{% extends "base.html" %}

{% block title %}Register Account - GreenCart{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      
      <div class="card card-custom border-0 shadow-lg p-4">
        <div class="text-center mb-4">
          <div class="brand-icon-box bg-success text-white mx-auto mb-2" style="width: 55px; height: 55px; font-size: 1.6rem;">
            <i class="bi bi-person-plus"></i>
          </div>
          <h3 class="fw-bold text-success">Create Your Account</h3>
          <p class="text-muted">Join GreenCart to buy healthy plants and access specialized plant services</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          
          <div class="row g-3">
            <div class="col-md-6">
              <label for="name" class="form-label fw-semibold">Full Name *</label>
              <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
            </div>
            
            <div class="col-md-6">
              <label for="email" class="form-label fw-semibold">Email Address *</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
            </div>

            <div class="col-md-6">
              <label for="phone" class="form-label fw-semibold">Phone Number *</label>
              <input type="tel" class="form-control" id="phone" name="phone" placeholder="9876543210" required>
            </div>

            <div class="col-md-6">
              <label for="role" class="form-label fw-semibold">Account Role *</label>
              <select class="form-select" id="role" name="role" required>
                <option value="CUSTOMER" selected>Customer / Plant Buyer</option>
                <option value="DELIVERY_PARTNER">Delivery Partner</option>
              </select>
              <div class="form-text">Admin registration is restricted.</div>
            </div>

            <div class="col-12">
              <label for="address" class="form-label fw-semibold">Street Address *</label>
              <textarea class="form-control" id="address" name="address" rows="2" placeholder="House/Flat No, Street, Landmark" required></textarea>
            </div>

            <div class="col-md-4">
              <label for="city" class="form-label fw-semibold">City *</label>
              <input type="text" class="form-control" id="city" name="city" placeholder="Mumbai" required>
            </div>

            <div class="col-md-4">
              <label for="state" class="form-label fw-semibold">State *</label>
              <input type="text" class="form-control" id="state" name="state" placeholder="Maharashtra" required>
            </div>

            <div class="col-md-4">
              <label for="pincode" class="form-label fw-semibold">Pincode *</label>
              <input type="text" class="form-control" id="pincode" name="pincode" placeholder="400001" required>
            </div>

            <hr class="my-4">

            <div class="col-md-4">
              <label for="username" class="form-label fw-semibold">Choose Username *</label>
              <input type="text" class="form-control" id="username" name="username" placeholder="johndoe" required>
            </div>

            <div class="col-md-4">
              <label for="password" class="form-label fw-semibold">Password *</label>
              <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required>
            </div>

            <div class="col-md-4">
              <label for="confirm_password" class="form-label fw-semibold">Confirm Password *</label>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 py-3 rounded-pill fw-bold shadow-sm mt-4">
            <i class="bi bi-check-circle me-2"></i>Complete Registration
          </button>
        </form>

        <div class="text-center mt-3">
          <p class="mb-0 text-muted">Already registered? <a href="{{ url_for('auth.login') }}" class="text-success fw-bold">Login Here</a></p>
        </div>

      </div>

    </div>
  </div>
</div>
{% endblock %}
