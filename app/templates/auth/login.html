{# GreenCart Production Login Portal - Updated 2026 #}
{% extends "base.html" %}

{% block title %}Login - GreenCart{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <div class="card card-custom border-0 shadow-lg p-4">
        <div class="text-center mb-4">
          <div class="brand-icon-box bg-success text-white mx-auto mb-2" style="width: 60px; height: 60px; font-size: 1.8rem;">
            <i class="bi bi-person-badge"></i>
          </div>
          <h3 class="fw-bold text-success">Welcome Back</h3>
          <p class="text-muted">Single Login Portal for Customer, Admin & Delivery Partner</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label for="login_input" class="form-label fw-semibold">Email or Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="login_input" name="login_input" placeholder="Enter your email or username" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 rounded-pill fw-bold shadow-sm mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>

        <div class="text-center mt-3">
          <p class="mb-0 text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-success fw-bold">Register Now</a></p>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
